services:
  - type: web
    name: utm-universe-render-peer
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: python3 -m py_compile utm_unified_domains/utm_universe/server.py utm_unified_domains/utm_universe/compute_fabric.py
    startCommand: cd utm_unified_domains/utm_universe && python3 server.py
    envVars:
      - key: WORLD_ID
        value: akashic-utm-main
      - key: PLANET_ID
        value: B612
      - key: REGION_ID
        value: San-Francisco
      - key: NODE_ID
        value: render-peer-1
      - key: AKASHIC_PATH
        value: /tmp/akashic.jsonl
      - key: FABRIC_PATH
        value: /tmp/compute-fabric.json
      - key: MAX_STEPS
        value: "2000"
      - key: FEDERATION_INTERVAL
        value: "30"
      - key: FEDERATION_PEERS
        value: https://utm-universe-production.up.railway.app,https://utm-universe-peer-production.up.railway.app
      - key: FEDERATION_TOKEN
        sync: false
