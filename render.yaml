services:
  - type: web
    name: utm-universe-render-peer
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: main
    rootDir: utm_unified_domains/utm_universe
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: WORLD_ID
        value: akashic-utm-main
      - key: PLANET_ID
        value: B612
      - key: REGION_ID
        value: San-Francisco
      - key: NODE_ID
        value: render-peer-1
      - key: AKASHIC_PATH
        value: /data/akashic.jsonl
      - key: FABRIC_PATH
        value: /data/compute-fabric.json
      - key: MAX_STEPS
        value: "2000"
      - key: FEDERATION_INTERVAL
        value: "30"
      - key: FEDERATION_PEERS
        value: https://utm-universe-production.up.railway.app,https://utm-universe-peer-production.up.railway.app
      - key: FEDERATION_TOKEN
        sync: false
    disk:
      name: utm-render-peer-data
      mountPath: /data
      sizeGB: 1
