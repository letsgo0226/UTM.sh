[build]
builder = "RAILPACK"
buildCommand = "python3 -m py_compile core.py single_function.py single_server.py && python3 -m unittest -v test_core.py test_single.py"

[deploy]
startCommand = "python3 single_server.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
