name: UTM Zero Information Entropy

on:
  push:
    branches: [main, master]
    paths:
      - "utm_unified_domains/integrity/ZERO_INFO_ENTROPY_TM.sh"
      - "utm_unified_domains/integrity/THERMO_INFO_GUARD_TM.sh"
      - "utm_unified_domains/utm/UTM.sh"
      - ".github/workflows/ZERO_INFO_ENTROPY.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify formal zero-information fixed point
        run: |
          set -euo pipefail
          DETERMINISTIC_VERIFIED=1 \
          OPEN_BRANCHES=1 \
          REVERSIBLE_VERIFIED=1 \
          INTEGRITY_VERIFIED=1 \
          CURRENT_VECTOR=2,0,1,0,0,0 \
          NEXT_VECTOR=2,0,1,0,0,0 \
          sh utm_unified_domains/integrity/ZERO_INFO_ENTROPY_TM.sh | tee cert-zero-info.json
          python3 - <<'PY'
          import json
          x=json.load(open('cert-zero-info.json'))
          assert x['model']=='UTM_FORMAL_ZERO_INFO_ENTROPY/1.0'
          assert x['utm']['halt'] is True
          assert x['utm']['t']==5 and x['utm']['tape']=='11111'
          assert x['certificate']['conditional_entropy_zero'] is True
          assert x['certificate']['formal_zero_information_fixed_point'] is True
          assert x['certificate']['utm_accept'] is True
          assert x['godel_log_coordinate']['ratio']==[1,1]
          assert x['godel_log_coordinate']['log_ratio_symbolic']=='0'
          assert x['godel_log_coordinate']['compactified_signed']==[0,1]
          print('PASS UTM formal zero-information fixed point')
          PY
      - name: Reject tableau identity fork
        run: |
          set -euo pipefail
          DETERMINISTIC_VERIFIED=1 \
          OPEN_BRANCHES=2 \
          REVERSIBLE_VERIFIED=1 \
          INTEGRITY_VERIFIED=1 \
          CURRENT_VECTOR=0,0,0,0,0,0 \
          NEXT_VECTOR=0,0,0,0,0,0 \
          sh utm_unified_domains/integrity/ZERO_INFO_ENTROPY_TM.sh | tee cert-fork.json
          python3 - <<'PY'
          import json
          x=json.load(open('cert-fork.json'))
          assert x['certificate']['conditional_entropy_zero'] is False
          assert x['certificate']['formal_zero_information_fixed_point'] is False
          assert x['certificate']['utm_accept'] is False
          print('PASS tableau fork rejection')
          PY
      - name: Distinguish deterministic evolution from fixed point
        run: |
          set -euo pipefail
          DETERMINISTIC_VERIFIED=1 \
          OPEN_BRANCHES=1 \
          REVERSIBLE_VERIFIED=1 \
          INTEGRITY_VERIFIED=1 \
          CURRENT_VECTOR=0,0,0,0,0,0 \
          NEXT_VECTOR=1,0,0,0,0,0 \
          sh utm_unified_domains/integrity/ZERO_INFO_ENTROPY_TM.sh | tee cert-displacement.json
          python3 - <<'PY'
          import json
          x=json.load(open('cert-displacement.json'))
          assert x['certificate']['conditional_entropy_zero'] is True
          assert x['certificate']['formal_zero_information_fixed_point'] is False
          assert x['certificate']['utm_accept'] is False
          assert x['godel_log_coordinate']['ratio']==[2,1]
          assert x['godel_log_coordinate']['log_ratio_symbolic']=='1*ln(2)'
          assert x['godel_log_coordinate']['compactified_signed']==[1,3]
          print('PASS deterministic non-fixed-point distinction')
          PY
      - name: Verify thermodynamic boundary guard remains separate
        run: |
          set -euo pipefail
          APPEND_ONLY=1 \
          INTEGRITY_VERIFIED=1 \
          DURABLE_COPY_VERIFIED=1 \
          LANDAUER_ACCOUNTED=1 \
          sh utm_unified_domains/integrity/THERMO_INFO_GUARD_TM.sh | tee cert-thermo-info.json
          python3 - <<'PY'
          import json
          x=json.load(open('cert-thermo-info.json'))
          assert x['utm_accept'] is True
          assert 'does not measure or control physical heat or thermodynamic entropy' in x['thermodynamics']['claim']
          print('PASS thermodynamic/information boundary separation')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zero-info-entropy-certificate
          path: cert-*.json
