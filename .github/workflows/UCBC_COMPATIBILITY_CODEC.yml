name: UCBC Compatibility Codec\n\non:\n  push:\n    branches: [ucbc-compatibility-codec-base]\n    paths:\n      - 'utm_unified_domains/utm_universe/**'\n      - '.github/workflows/UCBC_COMPATIBILITY_CODEC.yml'\n  pull_request:\n    paths:\n      - 'utm_unified_domains/utm_universe/**'\n      - '.github/workflows/UCBC_COMPATIBILITY_CODEC.yml'\n\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: UCBC compatibility tests\n        working-directory: utm_unified_domains/utm_universe/subprojects/UCBC_NATIVE\n        run: python3 test_ucbc.py\n      - name: Python syntax check\n        run: python3 -m py_compile utm_unified_domains/utm_universe/subprojects/UCBC_NATIVE/ucbc.py\n      - name: Protocol and manifest JSON checks\n        run: |\n          python3 - <<'PY'\n          import json\n          from pathlib import Path\n          files=[\n            'utm_unified_domains/utm_universe/world-manifest.json',\n            'utm_unified_domains/utm_universe/protocols/index.json',\n            'utm_unified_domains/utm_universe/protocols/UCBC-1.0.json',\n            'utm_unified_domains/utm_universe/protocols/UFAL-1.0.json',\n            'utm_unified_domains/utm_universe/protocols/LOG-ABELIAN-NATIVE-1.0.json',\n            'utm_unified_domains/utm_universe/protocols/UTM-THREE-SYSTEM-NATIVE-1.0.json',\n            'utm_unified_domains/utm_universe/subprojects/index.json',\n            'utm_unified_domains/utm_universe/subprojects/UCBC_NATIVE/manifest.json',\n          ]\n          for f in files:\n              json.loads(Path(f).read_text())\n              print('OK',f)\n          PY\n