name: UTM Omega Life Applications

on:
  push:
    branches: [utm-omega-life-applications]
    paths:
      - 'utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_LIFE_APPLICATIONS/**'
      - 'utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_RESIDENTS/**'
      - 'utm_unified_domains/utm_universe/protocols/**'
      - 'utm_unified_domains/utm_universe/world-manifest.json'
      - '.github/workflows/UTM_OMEGA_LIFE_APPLICATIONS.yml'
  pull_request:
    paths:
      - 'utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_LIFE_APPLICATIONS/**'
      - 'utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_RESIDENTS/**'
      - 'utm_unified_domains/utm_universe/protocols/**'
      - 'utm_unified_domains/utm_universe/world-manifest.json'
      - '.github/workflows/UTM_OMEGA_LIFE_APPLICATIONS.yml'

jobs:
  verify-applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile application verifier
        run: python3 -m py_compile utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_LIFE_APPLICATIONS/verify_applications.py
      - name: Verify five application targets
        run: python3 utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_LIFE_APPLICATIONS/verify_applications.py
      - name: Application tests
        run: python3 utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_LIFE_APPLICATIONS/test_applications.py
      - name: Verify updated Omega resident stage
        run: |
          python3 utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_RESIDENTS/verify_residents.py
          python3 utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_RESIDENTS/test_residents.py
      - name: Parse JSON application specs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('utm_unified_domains/utm_universe/subprojects/UTM_OMEGA_LIFE_APPLICATIONS')
          for f in root.glob('*.json'):
              json.loads(f.read_text())
              print('OK',f)
          PY
