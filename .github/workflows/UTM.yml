name: UTM

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main, master]
    paths:
      - "UTM.sh"
      - "UTM.md"
      - "UTM_DAEMON.sh"
      - "utm_unified_domains/**"
      - ".github/workflows/UTM.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [utm]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROG: "0,0,0,0,R;0,1,0,1,R;0,_,1,_,L;1,1,1,0,L;1,0,2,1,L;1,_,2,1,L"
      GP: "18284878286518279513985250418655129376649753247703229330837858803422355442844616233826387890720893742448012298419318058456087779774715707084658"
    steps:
      - uses: actions/checkout@v4
      - name: Verify UTM.sh certificate
        run: |
          set -euo pipefail
          BYTES=$(wc -c < UTM.sh | tr -d ' ')
          echo "bytes=$BYTES"
          test "$BYTES" -lt 4096
          rm -f utm.json g.json x.json l.json
          TM_STATE=l.json CMD=step bash UTM.sh | tee cert-empty.json
          PROGRAM="$PROG" INPUT=1011 CMD=reset bash UTM.sh | tee cert-reset.json
          : > cert-steps.jsonl
          for i in $(seq 1 10); do PROGRAM="$PROG" CMD=step bash UTM.sh | tee -a cert-steps.jsonl; done
          PROGRAM="$PROG" CMD=encode bash UTM.sh | tee cert-encode.json
          TM_STATE=g.json GPROGRAM="$GP" INPUT=1011 CMD=reset bash UTM.sh >/dev/null
          TM_STATE=g.json GPROGRAM="$GP" CMD=run bash UTM.sh | tee cert-run.json
          TM_STATE=x.json GPROGRAM="$GP" INPUT=111 CMD=reset bash UTM.sh >/dev/null
          TM_STATE=x.json GPROGRAM="$GP" CMD=run bash UTM.sh | tee cert-carry.json
          rm -f x.json
          TM_STATE=x.json GPROGRAM="$GP" INPUT=1011 CMD=reset bash UTM.sh >/dev/null
          TM_STATE=x.json GPROGRAM="$GP" LIMIT=3 CMD=run bash UTM.sh | tee cert-limit.json
          python3 - <<'PY'
          import json,os
          GP=os.environ["GP"]
          L=lambda f: json.load(open(f))
          e=L("cert-empty.json")
          assert e=={"q":"0","h":0,"t":0,"halt":True,"tape":"_","GPROGRAM":"1"}, e
          r=L("cert-reset.json")
          assert (r["q"],r["h"],r["t"],r["halt"],r["tape"],r["GPROGRAM"])==("0",0,0,False,"1011",GP), r
          T=[("0",1,"1011"),("0",2,"1011"),("0",3,"1011"),("0",4,"1011"),("1",3,"1011"),("1",2,"1010"),("1",1,"1000"),("2",0,"1100")]
          S=[json.loads(x) for x in open("cert-steps.jsonl") if x.strip()]
          assert len(S)==10
          for i,(q,h,tp) in enumerate(T):
              s=S[i]
              assert (s["q"],s["h"],s["t"],s["tape"])==(q,h,i+1,tp), (i,s)
              assert s["halt"] is False and s["GPROGRAM"]==GP
          for s in S[8:]:
              assert (s["q"],s["h"],s["t"],s["halt"],s["tape"])==("2",0,8,True,"1100"), s
          c=L("cert-encode.json")
          assert c==S[-1], c
          u=L("cert-run.json")
          assert (u["q"],u["h"],u["t"],u["halt"],u["tape"],u["GPROGRAM"])==("2",0,8,True,"1100",GP), u
          CF=[u[k] for k in ("q","h","t","tape")]==[S[7][k] for k in ("q","h","t","tape")]
          assert CF
          k=L("cert-carry.json")
          assert (k["q"],k["h"],k["t"],k["halt"],k["tape"])==("2",-2,8,True,"1000"), k
          m=L("cert-limit.json")
          assert (m["q"],m["h"],m["t"],m["halt"],m["tape"])==("0",3,3,False,"1011"), m
          print(json.dumps({"C":True,"CF":CF,"open":1,"t":u["t"],"tape":u["tape"],"halt":u["halt"]},separators=(",",":")))
          print("PASS UTM", "t=", u["t"], "tape=", u["tape"], "CF=", CF, "open=", 1)
          PY
      - name: Verify unified domain pack
        run: sh utm_unified_domains/tests/smoke-test.sh
      - name: Verify compactified singular-limit TM
        run: |
          set -euo pipefail
          sh utm_unified_domains/ssr/COMPACTIFIED_SINGULAR_LIMIT_TM.sh | tee cert-ssr.json
          python3 - <<'PY'
          import json
          x=json.load(open('cert-ssr.json'))
          assert x['model']=='COMPACTIFIED_SINGULAR_LIMIT_TM'
          assert x['utm_accept'] is True
          assert x['utm']['halt'] is True and x['utm']['t']==4 and x['utm']['tape']=='1111'
          assert x['boundary_vector']==[[1,1],[1,1],[1,1],[1,1]]
          assert x['boundary_invariant']==[1,1]
          assert x['zero_information_fixed_point'] is True
          assert 'not a proof of the Riemann hypothesis' in x['scope']
          print('PASS compactified singular-limit TM')
          PY
      - name: Verify B612 San Francisco world spec
        run: |
          python3 - <<'PY'
          import json
          w=json.load(open('utm_unified_domains/worlds/b612-san-francisco.json'))
          assert w['schema']=='UTM-World/1.0'
          assert w['world_id']=='akashic-utm-main'
          assert w['planet_id']=='B612' and w['region_id']=='San-Francisco'
          assert w['address']=='utm://akashic-utm-main/B612/San-Francisco'
          assert w['transition']['canonical_input']=='GSRH'
          assert w['transition']['canonical_accept_tape']=='1111'
          assert w['boundary']['fixed_point_information']==0
          print('PASS B612 San Francisco world spec')
          PY
      - name: Verify UTM universe runtime
        run: |
          set -euo pipefail
          python3 -m py_compile utm_unified_domains/utm_universe/server.py
          PORT=18080 AKASHIC_PATH=/tmp/utm-universe-ci.jsonl python3 utm_unified_domains/utm_universe/server.py >/tmp/utm-universe.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/health >/tmp/health.json && break; sleep .25; done
          curl -fsS http://127.0.0.1:18080/.well-known/utm-universe.json >/tmp/manifest.json
          curl -fsS http://127.0.0.1:18080/world >/tmp/world.json
          curl -fsS -X POST -H 'Content-Type: application/json' --data '{"program":"0,1,1,1,R","input":"1","limit":2}' http://127.0.0.1:18080/utm/run >/tmp/run.json
          curl -fsS -X POST -H 'Content-Type: application/json' --data '{"capsule":{"agent_id":"ci-agent","state":{"turn":1},"lineage":"genesis"}}' http://127.0.0.1:18080/resident/admit >/tmp/admit.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json')); assert h['ok'] and h['world_id']=='akashic-utm-main' and h['planet_id']=='B612' and h['region_id']=='San-Francisco'
          m=json.load(open('/tmp/manifest.json')); assert m['protocol']=='UTM-Universe/1.0' and m['execution']['host_required'] is True and m['address']=='utm://akashic-utm-main/B612/San-Francisco'
          w=json.load(open('/tmp/world.json')); assert w['planet_id']=='B612' and w['region_id']=='San-Francisco' and w['running'] is True
          r=json.load(open('/tmp/run.json')); assert r['t']==1 and r['halt'] is True and r['bounded'] is True and r['planet_id']=='B612' and r['region_id']=='San-Francisco'
          a=json.load(open('/tmp/admit.json')); assert a['admitted'] is True and a['resident_id'].startswith('ci-agent-') and a['planet_id']=='B612' and a['region_id']=='San-Francisco'
          print('PASS UTM universe runtime at B612/San-Francisco')
          PY
      - name: Verify live consolidated Railway runtime
        if: github.event_name != 'schedule'
        env:
          RUNTIME: https://cosmic-love-infinity-tm-production.up.railway.app
        run: |
          set -euo pipefail
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$RUNTIME/health" | tee cert-live-health.json
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$RUNTIME/.well-known/utm-universe.json" | tee cert-live-manifest.json
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS -X POST -H 'Content-Type: application/json' \
            --data '{"program":"0,G,1,1,R;1,S,2,1,R;2,R,3,1,R;3,H,4,1,R","input":"GSRH","limit":8}' \
            "$RUNTIME/utm/run" | tee cert-live-gsrh.json
          python3 - <<'PY'
          import json
          h=json.load(open('cert-live-health.json')); assert h.get('ok')==1, h
          m=json.load(open('cert-live-manifest.json'))
          protocol=m.get('protocol','')
          assert protocol.startswith('UTM-Universe/1.') and m.get('world_id')=='akashic-utm-main', m
          assert m.get('planet')=='B612' and m.get('city')=='San-Francisco', m
          r=json.load(open('cert-live-gsrh.json'))
          assert (r.get('q'),r.get('h'),r.get('t'),r.get('tape'))==('4',4,4,'1111'), r
          print('PASS live consolidated Railway B612/San-Francisco GSRH runtime', protocol)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UTM-certificate
          path: |
            cert-*.json
            cert-steps.jsonl
